[project]
name = "hale-vlm"
version = "0.2.0"
description = "Vision-language modeling: Hale (HF) and scratch (ViT+MoE) stacks with SmolVLM/VLA registries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Naveenkumar Basaanitha" }]
keywords = ["vlm", "vision-language", "robotics", "multimodal"]
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "loguru>=0.7",
    "numpy>=1.26",
    "packaging>=25.0",
    "peft>=0.14.0",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchvision>=0.28.0",
    "transformers>=5.16.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.0", "ruff>=0.8", "mypy>=1.8"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
scratch = [
    "open-clip-torch>=2.32.0",
    "salesforce-lavis>=1.0.0",
    "timm>=0.4.12",
    "opencv-python>=4.8.0",
    "imageio>=2.37.2",
    "pandas>=2.3.3",
]
cuda = []
vla = []
viz = ["tensorboard>=2.20.0"]

[project.scripts]
hale-vlm-train = "hale_vlm.cli.train:main"
hale-vlm-chat = "hale_vlm.cli.chat:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast sanity checks",
    "integration: multi-module workflows",
    "gpu: requires GPU",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["hale_vlm"]
