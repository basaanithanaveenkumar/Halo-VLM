# Phase 3 — VLM Post-Training (instruction-following SFT)
# Task-specific instruction fine-tuning across diverse visual benchmarks.
#
# Datasets: llava-instruct-665k, textvqa, scienceqa, chartqa, infographics-vqa,
#           seed-bench, llava-plus
# (task-balanced; typically 1–3 epochs on each benchmark)

inherits: base.yaml

data:
  source: phase_registry
  registry_phase: post_train
  streaming: true
  prefetch_workers: 2
  max_samples_per_dataset: 100000  # keep balanced across benchmarks

train:
  epochs: 3
  batch_size: 64
  lr: 2.0e-5
  warmup_steps: 500
  grad_clip: 1.0
